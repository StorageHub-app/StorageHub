name: CI

on:
  push:
    branches:
      - main
    # A stable release is cut by pushing its tag. The tag is the decision, recorded
    # in git before anything is published, and it names the exact commit that ships.
    # Ordinary pushes to main keep publishing prereleases from VersionPrefix.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every push must finish independently so each successful main commit can be
  # released. The ref is part of the key as well as the commit, because a release
  # tag points at a commit main has already built: keyed on the commit alone, the
  # tag run and the branch run would share a group and cancel one another.
  # Pull requests and manual runs still share their ref and cancel stale work.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'push'
      && format('{0}-{1}', github.ref, github.sha)
      || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    name: Release build, test, and audit
    runs-on: windows-2022
    timeout-minutes: 35

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out StorageHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Python fixture runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            eng/fixtures/ftp-requirements.txt
            eng/fixtures/sftp-requirements.txt

      - name: Restore locked dependencies and audit advisories
        shell: pwsh
        run: |
          dotnet restore StorageHub.slnx --locked-mode `
            -p:NuGetAudit=true `
            -p:NuGetAuditMode=all `
            '-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          # The Explorer drop broker is opt-in so a clone without the Visual Studio C++ build tools
          # can still build and test. CI has the toolchain, and the native smoke test below expects
          # this build to have produced the broker DLL.
          dotnet build StorageHub.slnx --configuration Release --no-restore `
            -p:StorageHubBuildShellExtension=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Release
        shell: pwsh
        run: |
          dotnet test StorageHub.slnx --configuration Release --no-build --no-restore `
            --logger trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native Explorer drop broker
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($msbuild)) {
            throw 'Visual Studio C++ MSBuild was not found.'
          }
          & $msbuild `
            .\tests\StorageHub.ShellExtension.Native.Tests\StorageHub.ShellExtension.Native.Tests.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $broker = (Resolve-Path `
            .\src\StorageHub.ShellExtension.Native\x64\Release\StorageHub.ShellExtension.Native.dll).Path
          $smoke = (Resolve-Path `
            .\tests\StorageHub.ShellExtension.Native.Tests\x64\Release\StorageHub.ShellExtension.Native.Tests.exe).Path
          $regsvr32 = Join-Path $env:SystemRoot 'System32\regsvr32.exe'
          $smokeExit = 1
          try {
            $registration = Start-Process -FilePath $regsvr32 `
              -ArgumentList @('/s', $broker) -Wait -PassThru -WindowStyle Hidden
            if ($registration.ExitCode -ne 0) { throw 'Explorer drop broker registration failed.' }
            & $smoke
            $smokeExit = $LASTEXITCODE
          }
          finally {
            $unregistration = Start-Process -FilePath $regsvr32 `
              -ArgumentList @('/s', '/u', $broker) -Wait -PassThru -WindowStyle Hidden
            if ($unregistration.ExitCode -ne 0 -and $smokeExit -eq 0) {
              $smokeExit = $unregistration.ExitCode
            }
          }
          if ($smokeExit -ne 0) { exit $smokeExit }

      - name: Test S3 conformance against disposable MinIO
        shell: pwsh
        run: |
          & .\eng\run-minio-integration.ps1 `
            -FixtureRoot (Join-Path $env:RUNNER_TEMP 'StorageHub-MinIO')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test FTP and FTPS conformance on disposable servers
        shell: pwsh
        run: |
          & .\eng\run-ftp-integration.ps1 `
            -FixtureRoot (Join-Path $env:RUNNER_TEMP 'StorageHub-FTP')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test SFTP conformance on disposable servers
        shell: pwsh
        run: |
          & .\eng\run-sftp-integration.ps1 `
            -FixtureRoot (Join-Path $env:RUNNER_TEMP 'StorageHub-SFTP')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit FTP fixture dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: eng/fixtures/ftp-requirements.txt
          require-hashes: true

      - name: Audit SFTP fixture dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: eng/fixtures/sftp-requirements.txt
          require-hashes: true

      - name: Report vulnerable packages
        shell: pwsh
        run: |
          dotnet list StorageHub.slnx package --vulnerable --include-transitive --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_attempt }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 14

  package-windows:
    name: Package and exercise Windows release
    needs: build-test-audit
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.release-version.outputs.artifact-name }}
      version: ${{ steps.release-version.outputs.version }}
      stable: ${{ steps.release-version.outputs.stable }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out StorageHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Derive immutable release version
        id: release-version
        shell: pwsh
        run: |
          if ($env:GITHUB_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'GITHUB_SHA is not a full Git commit ID.'
          }
          if ($env:GITHUB_RUN_NUMBER -notmatch '^[1-9][0-9]*$') {
            throw 'GITHUB_RUN_NUMBER is not a positive integer.'
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 12).ToLowerInvariant()
          $propsPath = Join-Path $env:GITHUB_WORKSPACE 'Directory.Build.props'
          $propsXml = [xml] (Get-Content -LiteralPath $propsPath -Raw)
          $versionPrefix = [string] (
            $propsXml.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1)
          if ($versionPrefix -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Directory.Build.props does not declare a valid VersionPrefix: '$versionPrefix'."
          }

          # A tag cuts the stable release at exactly its own version; a branch push cuts the
          # next release candidate from VersionPrefix. Nothing else publishes.
          $isStable = $env:GITHUB_REF -like 'refs/tags/*'
          if ($isStable) {
            $tagVersion = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($tagVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "Release tag '$env:GITHUB_REF' is not a vMAJOR.MINOR.PATCH tag."
            }

            # The tagged commit has to already declare the version being released. Without this
            # a tag could publish any version from any commit, and the assemblies inside the
            # bundle would disagree with the release that carries them.
            if ($tagVersion -cne $versionPrefix) {
              throw ("Tag '$tagVersion' does not match the VersionPrefix '$versionPrefix' " +
                'declared by the commit it points at.')
            }

            $version = $tagVersion
          } else {
            $version = "$versionPrefix-rc.$($env:GITHUB_RUN_NUMBER).g$shortSha"
          }

          # Stable is MAJOR.MINOR.PATCH exactly; a candidate must carry a prerelease part.
          $stablePattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          $candidatePattern =
            '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$'
          $expectedPattern = if ($isStable) { $stablePattern } else { $candidatePattern }
          if ($version -notmatch $expectedPattern) {
            throw "The derived release version '$version' is not valid for this trigger."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "stable=$($isStable.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "artifact-name=windows-release-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT

      - name: Build Windows release bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP 'StorageHub-Windows-Release'

          & .\eng\package-windows.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputRoot $bundleRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $versionFile = Join-Path $bundleRoot 'release-version.txt'
          if (-not (Test-Path -LiteralPath $versionFile -PathType Leaf)) {
            throw 'The package did not produce release-version.txt.'
          }
          $packagedVersion = (Get-Content -LiteralPath $versionFile -Raw).Trim()
          if ($packagedVersion -cne $env:RELEASE_VERSION) {
            throw "The package version '$packagedVersion' does not match '$env:RELEASE_VERSION'."
          }

      - name: Install, smoke-test, and uninstall package
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP 'StorageHub-Windows-Release'
          & .\eng\test-windows-installer.ps1 -BundleRoot $bundleRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload complete Windows release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release-version.outputs.artifact-name }}
          path: ${{ runner.temp }}/StorageHub-Windows-Release
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 30

  attest-windows:
    name: Attest Windows release provenance
    needs: package-windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      # This privileged job deliberately does not check out or execute
      # repository code. It only consumes the artifact produced in this run.
      - name: Download Windows release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package-windows.outputs.artifact-name }}
          path: windows-release

      - name: Attest release files
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: windows-release/*
          # Left off. Linked artifact storage records are an organization
          # feature, which this repository now qualifies for, but turning them
          # on changes what a release carries and is a decision of its own. The
          # signed provenance is published either way.
          create-storage-record: false

  publish-release:
    name: Publish Windows release
    needs:
      - package-windows
      - attest-windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    # The bundle is around 415 MB across four large assets. This job normally finishes in about
    # ninety seconds, but an upload that GitHub is throttling can run far longer, and when the
    # timeout struck mid-upload it left a draft release holding nine of the thirteen assets --
    # invisible to users, but enough to block the retry. The margin is now for the slow day.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write

    steps:
      # This is the only contents:write job. It never checks out or executes
      # repository code and only publishes the validated same-run artifact.
      - name: Download attested Windows release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package-windows.outputs.artifact-name }}
          path: windows-release

      - name: Validate release version and SHA-256 manifest
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.package-windows.outputs.version }}
          RELEASE_STABLE: ${{ needs.package-windows.outputs.stable }}
        run: |
          $bundleRoot = (Resolve-Path -LiteralPath 'windows-release').Path
          $versionPath = Join-Path $bundleRoot 'release-version.txt'
          $checksumsPath = Join-Path $bundleRoot 'SHA256SUMS'

          # Must agree with the derivation step: a stable release is MAJOR.MINOR.PATCH
          # exactly, and a candidate carries a prerelease part. Accepting either form
          # here regardless of the trigger would let one publish under the other's name.
          $expectedPattern = if ($env:RELEASE_STABLE -ceq 'true') {
            '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          } else {
            '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$'
          }
          if ($env:EXPECTED_VERSION -notmatch $expectedPattern) {
            throw "Expected version '$env:EXPECTED_VERSION' is not valid for this trigger."
          }
          if (-not (Test-Path -LiteralPath $versionPath -PathType Leaf)) {
            throw 'release-version.txt is missing from the release bundle.'
          }
          $actualVersion = (Get-Content -LiteralPath $versionPath -Raw).Trim()
          if ($actualVersion -cne $env:EXPECTED_VERSION) {
            throw "Bundle version '$actualVersion' does not match '$env:EXPECTED_VERSION'."
          }
          if (-not (Test-Path -LiteralPath $checksumsPath -PathType Leaf)) {
            throw 'SHA256SUMS is missing from the release bundle.'
          }

          $manifestEntries = @{}
          foreach ($line in Get-Content -LiteralPath $checksumsPath) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^(?<hash>[0-9A-Fa-f]{64})\s+(?:\*)?(?<name>.+)$') {
              throw "Invalid SHA256SUMS line: '$line'."
            }

            $name = $Matches.name.Trim()
            if ([string]::IsNullOrWhiteSpace($name) -or
                [IO.Path]::GetFileName($name) -cne $name) {
              throw "SHA256SUMS contains a non-flat or invalid path '$name'."
            }
            if ($manifestEntries.ContainsKey($name)) {
              throw "SHA256SUMS contains duplicate entry '$name'."
            }

            $assetPath = Join-Path $bundleRoot $name
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Checksummed release file '$name' is missing."
            }
            $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
            if ($actualHash -cne $Matches.hash.ToUpperInvariant()) {
              throw "SHA-256 verification failed for '$name'."
            }
            $manifestEntries.Add($name, $actualHash)
          }

          if ($manifestEntries.Count -eq 0) {
            throw 'SHA256SUMS does not contain any release files.'
          }

          $nestedFiles = Get-ChildItem -LiteralPath $bundleRoot -File -Recurse |
            Where-Object { $_.DirectoryName -cne $bundleRoot }
          if ($nestedFiles) {
            $names = ($nestedFiles.FullName | Sort-Object) -join ', '
            throw "The GitHub release bundle must be flat; nested files found: $names"
          }

          $unlistedFiles = Get-ChildItem -LiteralPath $bundleRoot -File |
            Where-Object {
              $_.Name -cne 'SHA256SUMS' -and
              -not $manifestEntries.ContainsKey($_.Name)
            }
          if ($unlistedFiles) {
            $names = ($unlistedFiles.Name | Sort-Object) -join ', '
            throw "Release files are not covered by SHA256SUMS: $names"
          }

      - name: Create or verify exact-commit release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package-windows.outputs.version }}
          RELEASE_STABLE: ${{ needs.package-windows.outputs.stable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $commit = $env:GITHUB_SHA.ToLowerInvariant()
          $tag = "v$env:RELEASE_VERSION"
          $bundleRoot = (Resolve-Path -LiteralPath 'windows-release').Path
          $escapedTag = [Uri]::EscapeDataString($tag)

          function Invoke-GhApiAllowNotFound([string] $endpoint) {
            $errorFile = Join-Path $env:RUNNER_TEMP `
              ("gh-error-" + [Guid]::NewGuid().ToString('N') + '.txt')
            $response = & gh api $endpoint 2> $errorFile
            $exitCode = $LASTEXITCODE
            $errorText = if (Test-Path -LiteralPath $errorFile) {
              Get-Content -LiteralPath $errorFile -Raw
            } else {
              ''
            }
            if ($exitCode -eq 0) { return $response }
            if ($errorText -match 'HTTP 404|Not Found|not found') { return $null }
            throw "GitHub API request '$endpoint' failed: $errorText"
          }

          function Resolve-TagCommit([pscustomobject] $tagRef) {
            $objectType = [string] $tagRef.object.type
            $objectSha = ([string] $tagRef.object.sha).ToLowerInvariant()
            for ($depth = 0; $depth -lt 5 -and $objectType -eq 'tag'; $depth++) {
              $tagObject = (& gh api "repos/$repo/git/tags/$objectSha" |
                ConvertFrom-Json)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $objectType = [string] $tagObject.object.type
              $objectSha = ([string] $tagObject.object.sha).ToLowerInvariant()
            }
            if ($objectType -ne 'commit') {
              throw "Release tag '$tag' does not resolve to a commit."
            }
            return $objectSha
          }

          $tagJson = Invoke-GhApiAllowNotFound `
            "repos/$repo/git/ref/tags/$escapedTag"
          $tagExists = $null -ne $tagJson
          if ($tagExists) {
            $tagCommit = Resolve-TagCommit ($tagJson | ConvertFrom-Json)
            if ($tagCommit -cne $commit) {
              throw "Release tag '$tag' targets '$tagCommit', not '$commit'."
            }
          }

          $releaseJson = Invoke-GhApiAllowNotFound `
            "repos/$repo/releases/tags/$escapedTag"
          $releaseExists = $null -ne $releaseJson
          $existingRelease = if ($releaseExists) {
            $releaseJson | ConvertFrom-Json
          } else {
            $null
          }
          if ($releaseExists -and -not $tagExists) {
            throw "Release '$tag' exists without a resolvable Git tag."
          }

          $isStable = $env:RELEASE_STABLE -ceq 'true'
          $notesPath = Join-Path $env:RUNNER_TEMP 'StorageHub-release-notes.md'
          $notes = if ($isStable) {
            @"
          StorageHub $env:RELEASE_VERSION, built from commit $commit.

          This release is built from the exact tested commit and carries GitHub
          artifact provenance. Verify every downloaded file against `SHA256SUMS`.

          These binaries are not yet Authenticode-signed, so Windows SmartScreen
          may warn on first run.
          "@
          } else {
            @"
          Automated StorageHub release candidate for commit $commit.

          This release is built from the exact tested commit and carries GitHub
          artifact provenance. Verify every downloaded file against `SHA256SUMS`.
          "@
          }
          [IO.File]::WriteAllText(
            $notesPath,
            $notes.Trim() + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false))

          $assets = @(Get-ChildItem -LiteralPath $bundleRoot -File |
            Sort-Object Name |
            ForEach-Object FullName)
          if ($assets.Count -eq 0) {
            throw 'The validated release bundle contains no files to publish.'
          }

          if (-not $releaseExists) {
            $targetArguments = if ($tagExists) {
              @('--verify-tag')
            } else {
              @('--target', $commit)
            }
            # A stable release becomes Latest and is what an installation that excludes
            # release candidates will see; a candidate never displaces it.
            $kindArguments = if ($isStable) {
              @('--latest')
            } else {
              @('--prerelease', '--latest=false')
            }
            # Built as one vector and splatted once, rather than mixing inline
            # arguments, line continuations and three separate splats. The previous
            # form put a bare '-' in front of gh somewhere between those pieces, and
            # gh read it as an asset pattern: "no matches found for `-`".
            $createArguments = @('release', 'create', $tag) +
              $assets +
              @('--repo', $repo) +
              $targetArguments +
              @('--title', "StorageHub $env:RELEASE_VERSION") +
              @('--notes-file', $notesPath) +
              $kindArguments

            # No secrets in this vector, and it is the only way to see what gh was
            # actually handed when it disagrees with what the script appears to say.
            Write-Host "gh $($createArguments -join ' ')"
            & gh @createArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            if ([bool] $existingRelease.draft -or
                [bool] $existingRelease.prerelease -eq $isStable) {
              $expected = if ($isStable) { 'stable release' } else { 'prerelease' }
              throw "Existing release '$tag' is not the expected published $expected."
            }

            [string[]] $existingAssetNames = @(
              $existingRelease.assets |
                ForEach-Object { [string] $_.name } |
                Sort-Object)
            [string[]] $candidateAssetNames = @(
              $assets |
                ForEach-Object { Split-Path -Leaf $_ } |
                Sort-Object)
            if ([string]::Join("`n", $existingAssetNames) -cne
                [string]::Join("`n", $candidateAssetNames)) {
              throw "Existing release '$tag' has an unexpected asset set; refusing to mutate it."
            }

            $invalidAssetNames = @($existingAssetNames | Where-Object {
              [string]::IsNullOrWhiteSpace($_) -or
              [IO.Path]::GetFileName($_) -cne $_
            })
            if ($invalidAssetNames.Count -gt 0) {
              throw "Existing release '$tag' contains a non-flat or invalid asset name."
            }
            $uniqueAssetNames = @($existingAssetNames | Select-Object -Unique)
            if ($uniqueAssetNames.Count -ne $existingAssetNames.Count) {
              throw "Existing release '$tag' contains duplicate asset names."
            }

            $downloadRoot = Join-Path $env:RUNNER_TEMP `
              ("StorageHub-existing-release-" + [Guid]::NewGuid().ToString('N'))
            [IO.Directory]::CreateDirectory($downloadRoot) | Out-Null
            & gh release download $tag --repo $repo --dir $downloadRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $nestedAssets = @(Get-ChildItem -LiteralPath $downloadRoot -File -Recurse |
              Where-Object { $_.DirectoryName -cne $downloadRoot })
            if ($nestedAssets.Count -gt 0) {
              throw "Downloaded release '$tag' contains nested assets."
            }
            $downloadedAssets = @(Get-ChildItem -LiteralPath $downloadRoot -File)
            [string[]] $downloadedAssetNames = @(
              $downloadedAssets | ForEach-Object Name | Sort-Object)
            if ([string]::Join("`n", $downloadedAssetNames) -cne
                [string]::Join("`n", $existingAssetNames)) {
              throw "Downloaded assets for release '$tag' do not match its GitHub asset list."
            }

            $downloadedVersionPath = Join-Path $downloadRoot 'release-version.txt'
            if (-not (Test-Path -LiteralPath $downloadedVersionPath -PathType Leaf)) {
              throw "Existing release '$tag' is missing release-version.txt."
            }
            $downloadedVersion =
              (Get-Content -LiteralPath $downloadedVersionPath -Raw).Trim()
            if ($downloadedVersion -cne $env:RELEASE_VERSION) {
              throw "Existing release '$tag' contains version '$downloadedVersion'."
            }

            $downloadedChecksumsPath = Join-Path $downloadRoot 'SHA256SUMS'
            if (-not (Test-Path -LiteralPath $downloadedChecksumsPath -PathType Leaf)) {
              throw "Existing release '$tag' is missing SHA256SUMS."
            }

            $downloadedManifestEntries = @{}
            foreach ($line in Get-Content -LiteralPath $downloadedChecksumsPath) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line -notmatch '^(?<hash>[0-9A-Fa-f]{64})\s+(?:\*)?(?<name>.+)$') {
                throw "Invalid SHA256SUMS line in existing release '$tag': '$line'."
              }

              $expectedHash = $Matches.hash.ToUpperInvariant()
              $name = $Matches.name.Trim()
              if ([string]::IsNullOrWhiteSpace($name) -or
                  [IO.Path]::GetFileName($name) -cne $name) {
                throw "Existing release SHA256SUMS contains invalid path '$name'."
              }
              if ($downloadedManifestEntries.ContainsKey($name)) {
                throw "Existing release SHA256SUMS contains duplicate entry '$name'."
              }

              $downloadedAssetPath = Join-Path $downloadRoot $name
              if (-not (Test-Path -LiteralPath $downloadedAssetPath -PathType Leaf)) {
                throw "Checksummed existing release asset '$name' is missing."
              }
              $downloadedHash =
                (Get-FileHash -LiteralPath $downloadedAssetPath -Algorithm SHA256).Hash
              if ($downloadedHash -cne $expectedHash) {
                throw "Existing release SHA-256 verification failed for '$name'."
              }
              $downloadedManifestEntries.Add($name, $downloadedHash)
            }

            if ($downloadedManifestEntries.Count -eq 0) {
              throw "Existing release '$tag' has an empty SHA256SUMS manifest."
            }
            $unverifiedAssets = @($downloadedAssets | Where-Object {
              $_.Name -cne 'SHA256SUMS' -and
              -not $downloadedManifestEntries.ContainsKey($_.Name)
            })
            if ($unverifiedAssets.Count -gt 0) {
              $names = ($unverifiedAssets.Name | Sort-Object) -join ', '
              throw "Existing release assets are not covered by SHA256SUMS: $names"
            }

            Write-Host "Release '$tag' already exists for this exact commit; its downloaded assets match its own SHA256SUMS, so it remains immutable."
          }

          $publishedTag = Invoke-GhApiAllowNotFound `
            "repos/$repo/git/ref/tags/$escapedTag"
          if ($null -eq $publishedTag) {
            throw "Release tag '$tag' was not created."
          }
          $publishedCommit = Resolve-TagCommit ($publishedTag | ConvertFrom-Json)
          if ($publishedCommit -cne $commit) {
            throw "Published tag '$tag' does not target '$commit'."
          }
