# The StorageHub test lab: real servers for the integration fixtures to talk to.
#
# The fixtures have always been here -- SftpProviderIntegrationTests, SshTerminalIntegrationTests,
# FtpFtpsProviderIntegrationTests, MinioS3ProviderIntegrationTests, WebDavProviderIntegrationTests and the
# cloud suites (AzureBlobProviderIntegrationTests, GoogleCloudStorageProviderIntegrationTests,
# SwiftProviderIntegrationTests) all read their endpoints from
# STORAGEHUB_* variables and skip when they are unset. What was never here was anything to point
# them at, so in practice they have always skipped. This is that.
#
# Everything binds to 127.0.0.1 on purpose. These servers hold throwaway credentials that are
# written in plain text in the generated .env, and a fixture that is reachable from the network is
# a fixture somebody else can log into.
#
# Start it with eng/testlab/New-TestLab.ps1, which mints the keys and certificates first -- the
# fingerprints in the fixtures are of those files, so the two cannot be generated independently.

name: storagehub-testlab

services:
  # ---------------------------------------------------------------- SFTP and SSH
  # Three servers rather than three users on one, because what is being tested is the server's
  # policy: which authentication it accepts, and which host key it presents.

  # Password only. The fixture asserts that a private key is refused here, which is the mirror of
  # the assertion on the key-only server below. The SSH terminal fixture opens a shell here too.
  sftp-password:
    build: ./sftp
    restart: unless-stopped
    environment:
      SFTP_USER: "${STORAGEHUB_SFTP_USERNAME}"
      SFTP_PASSWORD: "${STORAGEHUB_SFTP_PASSWORD}"
      AUTH_MODE: "password"
      HOST_KEY_NAME: "hostkey"
    ports:
      - "127.0.0.1:${STORAGEHUB_SFTP_PASSWORD_PORT}:22"
    volumes:
      - ./.fixtures/ssh:/fixtures:ro

  # Public key only. The fixture asserts that a password is refused here, and that the alternate
  # client key -- which is never added to authorized_keys -- is refused as well.
  sftp-key:
    build: ./sftp
    restart: unless-stopped
    environment:
      SFTP_USER: "${STORAGEHUB_SFTP_USERNAME}"
      SFTP_PASSWORD: ""
      AUTH_MODE: "key"
      HOST_KEY_NAME: "hostkey"
    ports:
      - "127.0.0.1:${STORAGEHUB_SFTP_PRIVATE_KEY_PORT}:22"
    volumes:
      - ./.fixtures/ssh:/fixtures:ro

  # The same user and password as the first, presenting a different host key. This is what makes
  # host-key pinning testable: connecting here with the first server's fingerprint must fail, and
  # it must fail because the key changed rather than because the credentials did.
  sftp-rotated:
    build: ./sftp
    restart: unless-stopped
    environment:
      SFTP_USER: "${STORAGEHUB_SFTP_USERNAME}"
      SFTP_PASSWORD: "${STORAGEHUB_SFTP_PASSWORD}"
      AUTH_MODE: "password"
      HOST_KEY_NAME: "hostkey-rotated"
    ports:
      - "127.0.0.1:${STORAGEHUB_SFTP_ROTATED_PORT}:22"
    volumes:
      - ./.fixtures/ssh:/fixtures:ro

  # ---------------------------------------------------------------- FTP and FTPS
  # Four endpoints, because the fixture walks a connection through each TLS posture in turn and
  # vsftpd holds exactly one policy per process. Each needs its own passive range: a data
  # connection is a second socket on a port the server nominates, so the range has to be published
  # as well as configured, and two servers sharing one would hand out each other's ports.

  ftp-plain:
    build: ./ftp
    restart: unless-stopped
    environment:
      FTP_USER: "${STORAGEHUB_FTP_USERNAME}"
      FTP_PASSWORD: "${STORAGEHUB_FTP_PASSWORD}"
      TLS_MODE: "plain"
      PASV_MIN_PORT: "30000"
      PASV_MAX_PORT: "30009"
    ports:
      - "127.0.0.1:${STORAGEHUB_FTP_PLAIN_PORT}:21"
      - "127.0.0.1:30000-30009:30000-30009"
    volumes:
      - ./.fixtures/tls:/tls:ro

  ftp-explicit:
    build: ./ftp
    restart: unless-stopped
    environment:
      FTP_USER: "${STORAGEHUB_FTP_USERNAME}"
      FTP_PASSWORD: "${STORAGEHUB_FTP_PASSWORD}"
      TLS_MODE: "explicit"
      PASV_MIN_PORT: "30010"
      PASV_MAX_PORT: "30019"
    ports:
      - "127.0.0.1:${STORAGEHUB_FTP_EXPLICIT_PORT}:21"
      - "127.0.0.1:30010-30019:30010-30019"
    volumes:
      - ./.fixtures/tls:/tls:ro

  ftp-implicit:
    build: ./ftp
    restart: unless-stopped
    environment:
      FTP_USER: "${STORAGEHUB_FTP_USERNAME}"
      FTP_PASSWORD: "${STORAGEHUB_FTP_PASSWORD}"
      TLS_MODE: "implicit"
      PASV_MIN_PORT: "30020"
      PASV_MAX_PORT: "30029"
    ports:
      - "127.0.0.1:${STORAGEHUB_FTP_IMPLICIT_PORT}:21"
      - "127.0.0.1:30020-30029:30020-30029"
    volumes:
      - ./.fixtures/tls:/tls:ro

  # Demands a client certificate and checks it against the lab's CA. Without both of those this is
  # the explicit endpoint with a longer name, and the fixture's client-certificate assertions would
  # pass against a server that never looked.
  ftp-mtls:
    build: ./ftp
    restart: unless-stopped
    environment:
      FTP_USER: "${STORAGEHUB_FTP_USERNAME}"
      FTP_PASSWORD: "${STORAGEHUB_FTP_PASSWORD}"
      TLS_MODE: "mtls"
      PASV_MIN_PORT: "30030"
      PASV_MAX_PORT: "30039"
    ports:
      - "127.0.0.1:${STORAGEHUB_FTP_MTLS_PORT}:21"
      - "127.0.0.1:30030-30039:30030-30039"
    volumes:
      - ./.fixtures/tls:/tls:ro

  # ---------------------------------------------------------------- WebDAV
  # rclone serving a folder over WebDAV, once in plain HTTP and once over HTTPS with the lab's
  # server certificate -- the same certificate the FTPS endpoints present, so one pin covers both.
  # Two servers rather than one because the fixture asserts that TLS spoken to the plain port fails
  # as a TLS failure, which needs a port that does not speak TLS at all.
  #
  # The fixture's root is "mounted", and a WebDAV root has to exist the way a mount point does, so
  # each makes it before serving. The image's entrypoint is rclone itself, hence the shell.

  webdav:
    image: rclone/rclone:1.71.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /data/mounted &&
        exec rclone serve webdav /data --addr :8080
        --user "$$WEBDAV_USER" --pass "$$WEBDAV_PASSWORD"
    environment:
      WEBDAV_USER: "${STORAGEHUB_WEBDAV_USERNAME}"
      WEBDAV_PASSWORD: "${STORAGEHUB_WEBDAV_PASSWORD}"
    ports:
      - "127.0.0.1:${STORAGEHUB_WEBDAV_PORT}:8080"

  webdav-tls:
    image: rclone/rclone:1.71.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /data/mounted &&
        exec rclone serve webdav /data --addr :8443
        --cert /tls/server.crt --key /tls/server.key
        --user "$$WEBDAV_USER" --pass "$$WEBDAV_PASSWORD"
    environment:
      WEBDAV_USER: "${STORAGEHUB_WEBDAV_USERNAME}"
      WEBDAV_PASSWORD: "${STORAGEHUB_WEBDAV_PASSWORD}"
    ports:
      - "127.0.0.1:${STORAGEHUB_WEBDAV_TLS_PORT}:8443"
    volumes:
      - ./.fixtures/tls:/tls:ro

  # ---------------------------------------------------------------- S3
  # MinIO speaks the S3 API, so the S3 provider can be exercised without an AWS account and without
  # anything leaving the machine.

  # MinIO no longer publishes public images; pgsty/minio is a pinned community build of the same
  # server, and it carries mc, so the bucket job below uses it too.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${STORAGEHUB_MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${STORAGEHUB_MINIO_SECRET_KEY}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The bucket has to exist before the fixture runs, and MinIO has no way to declare one at start.
  # This runs once, makes it, and exits -- so `up` blocks on it rather than leaving the fixture to
  # race a bucket that is not there yet.
  minio-bucket:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set lab http://minio:9000 '${STORAGEHUB_MINIO_ACCESS_KEY}' '${STORAGEHUB_MINIO_SECRET_KEY}' &&
      mc mb --ignore-existing lab/'${STORAGEHUB_MINIO_BUCKET}' &&
      echo 'bucket ${STORAGEHUB_MINIO_BUCKET} ready'
      "
    restart: "no"

  # ---------------------------------------------------------------- Azure Blob Storage
  # Azurite, Microsoft's own emulator, with its well-known development account. It speaks plain
  # HTTP, which StorageHub allows only through a connection string the user marked as plain HTTP --
  # so the fixture signs in that way, and checks that the same string unacknowledged is refused.
  # --skipApiVersionCheck because the SDK inside CodeLogic may be newer than this Azurite release.
  # The fixture makes its own container, so nothing has to run before it.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports:
      - "127.0.0.1:${STORAGEHUB_AZURITE_PORT}:10000"

  # ---------------------------------------------------------------- Google Cloud Storage
  # fake-gcs-server, which speaks the Cloud Storage JSON API and checks no credentials. Plain HTTP,
  # which the fixture's profile acknowledges. The external URL is what it puts in a resumable
  # upload's Location header, so it has to be the address the fixture reaches it by. The fixture
  # makes its own bucket, so nothing has to run before it.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    restart: unless-stopped
    command: >
      -scheme http -port 4443 -backend memory
      -public-host 127.0.0.1:${STORAGEHUB_FAKE_GCS_PORT}
      -external-url http://127.0.0.1:${STORAGEHUB_FAKE_GCS_PORT}
    ports:
      - "127.0.0.1:${STORAGEHUB_FAKE_GCS_PORT}:4443"

  # ---------------------------------------------------------------- OpenStack Swift
  # The OpenStack project's own all-in-one Swift, with TempAuth and its test:tester account. Plain
  # HTTP, which the fixture's profile acknowledges. TempAuth builds the storage URL it hands back
  # from the Host header it was asked on, so mapping the same port on both sides keeps that URL one
  # the host can reach. The image has no release tag newer than 2020, so it is pinned by digest.
  # The fixture makes its own container, so nothing has to run before it.
  swift:
    image: openstackswift/saio:py3@sha256:9c91b87887d1392050d81b8a797467cd5916c26c97dda3fb5f86d8da91f31f94
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STORAGEHUB_SWIFT_PORT}:8080"

  # ---------------------------------------------------------------- proxy
  # An HTTP proxy, and a SOCKS5 one that wants a sign-in. The proxy tests address the servers
  # above by their service names (minio, sftp-password), which resolve only inside this network,
  # so a test that passes has gone through the proxy rather than around it.

  proxy:
    image: gogost/gost:3.3.0
    restart: unless-stopped
    command: >
      -L http://:3128
      -L socks5://${STORAGEHUB_PROXY_USERNAME}:${STORAGEHUB_PROXY_PASSWORD}@:1080
    ports:
      - "127.0.0.1:${STORAGEHUB_PROXY_HTTP_PORT}:3128"
      - "127.0.0.1:${STORAGEHUB_PROXY_SOCKS5_PORT}:1080"
